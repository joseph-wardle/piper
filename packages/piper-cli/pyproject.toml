[project]
name = "piper-cli"
version = "0.1.0"
description = "Command-line front door to Piper operations."
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "piper-core",
    "piper-studio",
    "cyclopts>=4.25.2",
    "rich>=14",
    "usd-core==25.5",
]

[project.scripts]
piper = "piper_cli.main:main"

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"
