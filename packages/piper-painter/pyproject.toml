[project]
name = "piper-painter"
version = "0.1.0"
description = "Piper inside Substance Painter: its menu items, and opening and publishing an asset's work."
requires-python = ">=3.11"
license = "Apache-2.0"
# Everything named here, and everything it needs, is importable inside Painter:
# `just sync` builds this package's own environment for Painter's PYTHONPATH.
# Pure Python only, and nothing Painter brings itself, such as `PySide6`. Painter
# runs its own Python, 3.13 in Painter 12, and loads no USD at all.
dependencies = [
    "piper-core",
    "piper-studio",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"
