[project]
name = "piper-houdini"
version = "0.1.0"
description = "Piper inside Houdini: its menu, its material node, and opening and publishing an asset's work."
requires-python = ">=3.11"
license = "Apache-2.0"
# Everything named here, and everything it needs, is importable inside Houdini:
# `just sync` builds this package's own environment for Houdini's PYTHONPATH.
# Pure Python only, and nothing Houdini brings itself, such as `pxr` or `PySide6`.
dependencies = [
    "piper-core",
    "piper-studio",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"
