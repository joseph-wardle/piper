[project]
name = "piper-shotgrid"
version = "0.1.0"
description = "ShotGrid translated into Piper's tracker contract."
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "piper-core",
    "shotgun-api3>=3.10.3",
]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"
