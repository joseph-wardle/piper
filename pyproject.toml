[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
piper-core = { workspace = true }
piper-houdini = { workspace = true }
piper-maya = { workspace = true }
piper-painter = { workspace = true }
piper-shotgrid = { workspace = true }
piper-studio = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=9.1",
    "ruff>=0.14.2",
    "ty==0.0.79",
]

[tool.ty.analysis]
# USD's and Maya's Python modules are compiled extensions with no type
# information, and each host's, its Qt among them, is only ever present inside that host.
replace-imports-with-any = [
    "pxr", "pxr.**", "maya", "maya.**", "hou", "PySide6", "substance_painter", "substance_painter.**",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "N", "UP", "B", "SIM", "ANN", "PTH", "RUF"]

[tool.pytest.ini_options]
testpaths = ["packages"]
addopts = ["-m", "not integration"]
markers = [
    "integration: talks to a real external system; needs credentials",
]

[tool.ruff.lint.isort]
known-first-party = [
    "piper", "piper_cli", "piper_houdini", "piper_maya", "piper_painter", "piper_shotgrid", "piper_studio",
]
